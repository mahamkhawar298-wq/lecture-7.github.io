<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐱✨ Pro Age Calculator · Center & Corner Cat</title>
  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b0e14;
      font-family: 'Outfit', 'Inter', sans-serif;
      padding: 1.8rem;
      position: relative;
      overflow-x: hidden;
    }

    /* 🎆 MOVING LIGHTS BACKGROUND — advanced pro effect */
    .lighting-aura {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .light {
      position: absolute;
      width: 60vmax;
      height: 60vmax;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255, 180, 160, 0.25), rgba(100, 150, 255, 0.1), transparent 70%);
      filter: blur(70px);
      mix-blend-mode: screen;
      animation: floatLight 18s infinite alternate ease-in-out;
      opacity: 0.7;
    }

    .light:nth-child(1) {
      background: radial-gradient(circle, #ffb7b0 0%, #a48ad3 40%, transparent 80%);
      top: -10%;
      left: -10%;
      animation-duration: 22s;
    }

    .light:nth-child(2) {
      background: radial-gradient(circle, #a7c0ff 0%, #fbc2b5 50%, transparent 80%);
      bottom: -10%;
      right: -5%;
      width: 70vmax;
      height: 70vmax;
      animation-duration: 25s;
      animation-direction: alternate-reverse;
    }

    .light:nth-child(3) {
      background: radial-gradient(circle, #d9b8ff 0%, #fdd9b5 40%, transparent 80%);
      top: 30%;
      left: 60%;
      width: 50vmax;
      height: 50vmax;
      animation-duration: 20s;
      filter: blur(90px);
    }

    @keyframes floatLight {
      0% { transform: translate(0, 0) scale(1) rotate(0deg); }
      100% { transform: translate(10%, 12%) scale(1.2) rotate(8deg); }
    }

    /* ─── MAIN CARD — PERFECTLY CENTERED, PRO, GLASS ─── */
    .glass-card {
      position: relative;
      z-index: 10;
      max-width: 980px;
      width: 100%;
      background: rgba(20, 25, 35, 0.55);
      backdrop-filter: blur(18px) saturate(180%);
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      border-radius: 48px;
      padding: 2.5rem 2.8rem;
      border: 1px solid rgba(255, 220, 200, 0.18);
      box-shadow: 0 30px 50px -10px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(240, 200, 180, 0.1) inset, 0 0 30px rgba(200, 160, 255, 0.2);
      transition: box-shadow 0.3s;
      margin: 0 auto;
      text-align: center;
    }

    .glass-card:hover {
      box-shadow: 0 35px 55px -8px #00000060, 0 0 0 1px #ffdbca30 inset, 0 0 40px #b8a2ff40;
    }

    h1 {
      font-weight: 600;
      font-size: 2.5rem;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #f7e3da, #d4c5ff, #b3d9ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 0.2rem;
      filter: drop-shadow(0 4px 6px #00000030);
    }

    .pro-badge {
      display: inline-block;
      background: rgba(255, 240, 230, 0.1);
      backdrop-filter: blur(8px);
      padding: 0.4rem 1.6rem;
      border-radius: 40px;
      font-weight: 500;
      color: #e2cfff;
      border: 1px solid #b9a9e0;
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    /* console area */
    .console-pro {
      background: rgba(8, 12, 18, 0.6);
      backdrop-filter: blur(8px);
      border-radius: 32px;
      padding: 1.6rem 2rem;
      margin: 1.8rem 0;
      border: 1px solid #3e3a60;
      box-shadow: inset 0 6px 10px #00000040, 0 8px 0 #10131e;
    }

    .console-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 1rem;
    }

    .win-dot {
      width: 14px; height: 14px; border-radius: 50%;
      background: #ff7b7b; box-shadow: 0 0 12px #ff9494;
    }
    .win-dot:nth-child(2) { background: #f5c542; box-shadow: 0 0 12px #fad475; }
    .win-dot:nth-child(3) { background: #6fcf97; box-shadow: 0 0 12px #8fe6b0; }

    .console-header span {
      margin-left: auto;
      color: #cbc3e6;
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 0.5px;
    }

    #consoleOutput {
      background: #0d1220e0;
      border-radius: 22px;
      padding: 1.3rem 1.8rem;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.95rem;
      line-height: 1.6;
      color: #e3defa;
      min-height: 200px;
      max-height: 260px;
      overflow-y: auto;
      border-left: 6px solid #a48ad3;
      box-shadow: inset 0 3px 12px #000000;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-word;
      scroll-behavior: smooth;
    }

    /* input row */
    .input-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 18px 30px;
      background: #1a1e2caa;
      backdrop-filter: blur(10px);
      padding: 1rem 2.2rem;
      border-radius: 60px;
      margin: 24px 0 30px;
      border: 1px solid #4f4780;
    }

    .input-row label {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #dfd2ff;
      font-weight: 500;
      font-size: 0.95rem;
    }

    .input-row input {
      background: #0f1420;
      border: 2px solid #5e4f8b;
      border-radius: 40px;
      padding: 0.6rem 1.2rem;
      color: white;
      font-weight: 500;
      width: 120px;
      outline: none;
      transition: 0.2s;
      font-family: 'Outfit', sans-serif;
    }

    .input-row input:focus {
      border-color: #c2aaff;
      box-shadow: 0 0 0 3px #7d66b950;
    }

    /* button grid — pro style */
    .button-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 14px;
      margin: 10px 0 20px;
    }

    .pro-btn {
      background: #1e2338cc;
      backdrop-filter: blur(8px);
      border: 1.5px solid #6b5f9e;
      border-radius: 48px;
      padding: 0.9rem 0.3rem;
      font-weight: 600;
      color: #efeaff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 0 #0c0f19, 0 6px 12px #00000040;
      transition: 0.1s ease;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .pro-btn i { color: #cbb2ff; }
    .pro-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #0e121c, 0 10px 18px #00000060;
      background: #2c2f50;
      border-color: #a38eda;
    }
    .pro-btn:active {
      transform: translateY(5px);
      box-shadow: 0 3px 0 #0c0f19;
    }

    .action-bar {
      display: flex;
      gap: 18px;
      justify-content: center;
      margin-top: 20px;
    }
    .btn-wide { flex: 2; background: #342e4e; border-color: #9a84d4; }

    .footer-note {
      margin-top: 28px;
      color: #aca3d9;
      font-size: 0.85rem;
      display: flex;
      justify-content: center;
      gap: 30px;
    }

    /* 🐱 MOVING CAT — ONLY IN BOTTOM RIGHT CORNER */
    #movingCat {
      position: fixed;
      z-index: 999;
      pointer-events: none;
      width: 90px;
      height: auto;
      filter: drop-shadow(0 8px 18px #00000070) drop-shadow(0 0 15px #ffd7b0);
      transition: transform 0.08s linear;
      animation: catHover 3s infinite alternate ease-in-out;
      will-change: left, top;
      /* restricted to bottom-right via JS */
    }

    @keyframes catHover {
      0% { transform: translateY(0px) rotate(-1deg); }
      100% { transform: translateY(-12px) rotate(2deg); }
    }

    /* custom cat SVG */
    .cat-svg {
      width: 100%;
      display: block;
    }

    /* scroll */
    #consoleOutput::-webkit-scrollbar { width: 6px; }
    #consoleOutput::-webkit-scrollbar-track { background: #1c1f30; border-radius: 10px; }
    #consoleOutput::-webkit-scrollbar-thumb { background: #7c6bb0; border-radius: 10px; }

    .smiley-touch {
      font-size: 1.2rem;
      vertical-align: middle;
    }
  </style>
</head>
<body>

<!-- 🎆 MOVING LIGHTS (advanced color combination) -->
<div class="lighting-aura">
  <div class="light"></div>
  <div class="light"></div>
  <div class="light"></div>
</div>

<!-- 🐱 MOVING CAT — ONLY BOTTOM RIGHT CORNER (vector image) -->
<div id="movingCat">
  <svg class="cat-svg" viewBox="0 0 120 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="60" cy="60" rx="38" ry="28" fill="#FCD5B5" stroke="#EAAA8C" stroke-width="3"/>
    <polygon points="28,38 18,10 40,30" fill="#FCD5B5" stroke="#EAAA8C" stroke-width="3"/>
    <polygon points="92,38 102,10 80,30" fill="#FCD5B5" stroke="#EAAA8C" stroke-width="3"/>
    <polygon points="30,36 24,18 38,32" fill="#F7B89C"/>
    <polygon points="90,36 96,18 82,32" fill="#F7B89C"/>
    <ellipse cx="47" cy="54" rx="7" ry="8" fill="#2F2A3D"/>
    <ellipse cx="73" cy="54" rx="7" ry="8" fill="#2F2A3D"/>
    <circle cx="49" cy="51" r="3" fill="white"/>
    <circle cx="75" cy="51" r="3" fill="white"/>
    <path d="M52 68 Q60 78 68 68" stroke="#7B5A4C" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="60" cy="63" rx="4" ry="3" fill="#EAA58B"/>
    <line x1="30" y1="58" x2="12" y2="52" stroke="#B18B7A" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="30" y1="65" x2="10" y2="68" stroke="#B18B7A" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="90" y1="58" x2="108" y2="52" stroke="#B18B7A" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="90" y1="65" x2="110" y2="68" stroke="#B18B7A" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="38" cy="66" r="6" fill="#FFB6C180"/>
    <circle cx="82" cy="66" r="6" fill="#FFB6C180"/>
  </svg>
</div>

<!-- MAIN CARD — PERFECTLY CENTERED -->
<div class="glass-card">
  <h1>
    <i class="fa-solid fa-cake-candles" style="color: #f5c2b1;"></i> 
    age·calculator 
    <span class="smiley-touch">😊✨</span>
  </h1>
  <div class="pro-badge">
    <i class="fa-regular fa-gem"></i> moving lights · corner kitty · advanced
  </div>

  <!-- Console -->
  <div class="console-pro">
    <div class="console-header">
      <div class="win-dot"></div><div class="win-dot"></div><div class="win-dot"></div>
      <span><i class="fa-regular fa-terminal"></i> OUTPUT · console.log</span>
    </div>
    <div id="consoleOutput">
      😺✨ Meow! Professional age lab ready.<br>👉 Kitty moves only in bottom-right corner 🐾
    </div>
  </div>

  <!-- variables -->
  <div class="input-row">
    <label><i class="fa-regular fa-user"></i> name <input type="text" id="inputName" value="Alex" placeholder="name"></label>
    <label><i class="fa-regular fa-calendar"></i> birth year <input type="number" id="inputBirthYear" value="1998" min="1900" max="2026"></label>
    <label><i class="fa-solid fa-clapperboard"></i> fav movie <input type="text" id="inputMovie" value="Interstellar" placeholder="movie"></label>
  </div>

  <!-- Buttons -->
  <div class="button-grid">
    <button class="pro-btn" id="calcAgeBtn"><i class="fa-solid fa-calculator"></i> 🎂 age</button>
    <button class="pro-btn" id="votingBtn"><i class="fa-solid fa-check-to-slot"></i> 🗳️ vote</button>
    <button class="pro-btn" id="introBtn"><i class="fa-solid fa-message"></i> 📝 intro</button>
    <button class="pro-btn" id="addNumbersBtn"><i class="fa-solid fa-plus"></i> ➕ add</button>
    <button class="pro-btn" id="loopBtn"><i class="fa-solid fa-arrow-rotate-left"></i> 🔟 1–10</button>
    <button class="pro-btn" id="posNegBtn"><i class="fa-solid fa-divide"></i> ➖➕ pos/neg</button>
  </div>

  <div class="action-bar">
    <button class="pro-btn btn-wide" id="runAllBtn"><i class="fa-solid fa-play"></i> 🚀 run all features</button>
    <button class="pro-btn" id="clearConsoleBtn"><i class="fa-regular fa-trash-can"></i> 🧹 clear</button>
  </div>

  <div class="footer-note">
    <span><i class="fa-regular fa-star"></i> functions · template literals · loops · if/else</span>
    <span><i class="fa-regular fa-heart"></i> kitty in corner only 🐱</span>
  </div>
</div>

<script>
  (function(){
    "use strict";

    // ---------- MOVING CAT — RESTRICTED TO BOTTOM RIGHT CORNER ----------
    const cat = document.getElementById('movingCat');
    let mouseX = window.innerWidth - 120, mouseY = window.innerHeight - 120;
    let catX = mouseX, catY = mouseY;

    // track mouse but constrain to bottom-right quadrant
    document.addEventListener('mousemove', (e) => {
      // only update if mouse is in bottom-right area (optional), but we'll just map to corner
      const rawX = e.clientX;
      const rawY = e.clientY;
      // map to bottom-right: range (window/2 .. window) -> but we'll clamp later
      mouseX = Math.min(window.innerWidth - 30, Math.max(window.innerWidth/2 + 50, rawX));
      mouseY = Math.min(window.innerHeight - 30, Math.max(window.innerHeight/2 + 30, rawY));
    });

    document.addEventListener('touchmove', (e) => {
      if (e.touches.length) {
        const rawX = e.touches[0].clientX;
        const rawY = e.touches[0].clientY;
        mouseX = Math.min(window.innerWidth - 30, Math.max(window.innerWidth/2 + 50, rawX));
        mouseY = Math.min(window.innerHeight - 30, Math.max(window.innerHeight/2 + 30, rawY));
      }
    }, {passive: true});

    function animateCat() {
      // smooth movement but stay in bottom-right zone
      catX += (mouseX - catX) * 0.07;
      catY += (mouseY - catY) * 0.07;
      
      // hard clamp to bottom-right corner (safe area)
      const minX = window.innerWidth/2 + 30;
      const minY = window.innerHeight/2 + 20;
      const maxX = window.innerWidth - 100;
      const maxY = window.innerHeight - 100;
      
      const finalX = Math.min(maxX, Math.max(minX, catX));
      const finalY = Math.min(maxY, Math.max(minY, catY));
      
      cat.style.left = finalX + 'px';
      cat.style.top = finalY + 'px';
      
      requestAnimationFrame(animateCat);
    }
    requestAnimationFrame(animateCat);

    // on resize adjust mouse target
    window.addEventListener('resize', () => {
      mouseX = Math.min(window.innerWidth - 30, window.innerWidth - 120);
      mouseY = Math.min(window.innerHeight - 30, window.innerHeight - 120);
    });

    // ---------- AGE CALCULATOR ----------
    const outputDiv = document.getElementById('consoleOutput');
    const inputName = document.getElementById('inputName');
    const inputBirthYear = document.getElementById('inputBirthYear');
    const inputMovie = document.getElementById('inputMovie');

    function logToConsole(msg) {
      const time = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const line = `<span style="color: #bfb0ff;">[${time}]</span> ${msg}`;
      if (outputDiv.innerHTML.includes('Meow! Professional')) outputDiv.innerHTML = line;
      else outputDiv.innerHTML += '<br>' + line;
      outputDiv.scrollTop = outputDiv.scrollHeight;
    }
    function dualLog(m) { console.log(`😺 ${m}`); logToConsole(m); }

    function getVars() {
      const name = inputName.value.trim() || 'Alex';
      const birth = parseInt(inputBirthYear.value, 10);
      const movie = inputMovie.value.trim() || 'Interstellar';
      return { name, birth, movie };
    }

    function calcAge(year) {
      const cur = new Date().getFullYear();
      return (isNaN(year) || year > cur || year < 1900) ? null : cur - year;
    }

    function runAge() {
      const { birth } = getVars();
      const age = calcAge(birth);
      dualLog(age ? `🎂 Age: ${age} years (born ${birth}) ${age>=60?'🧓':(age>=30?'🧔':'🧑')}` : `❌ Invalid year (${birth})`);
    }
    function runVoting() {
      const { name, birth } = getVars();
      const age = calcAge(birth);
      if (age===null) { dualLog(`⚠️ Can't check voting`); return; }
      dualLog(`🗳️ ${name}, ${age}: ${age>=18 ? '✅ Eligible to vote!' : '⛔ Not yet'}`);
    }
    function runIntro() {
      const { name, birth, movie } = getVars();
      const age = calcAge(birth);
      dualLog(`📝 Intro: 👋 I'm ${name}, ${age ?? '?'} y/o. Fav movie: "${movie}" 🎬`);
    }
    function runAdd() {
      const sum = ((a,b)=>a+b)(42,27);
      dualLog(`➕ 42 + 27 = ${sum} (function add) 🧮`);
    }
    function runLoop() {
      let arr = [];
      for(let i=1;i<=10;i++) arr.push(i+(i===10?'🔟':(i===5?'✋':'')));
      dualLog(`🔁 1→10: ${arr.join(' · ')}`);
    }
    function runPosNeg() {
      const vals = [-7, 3.5, 0, 12];
      const res = vals.map(v => `${v} → ${v>0?'positive➕':v<0?'negative➖':'zero0️⃣'}`);
      dualLog(`⚖️ Pos/Neg: ${res.join('  ·  ')}`);
    }
    function runAll() {
      dualLog('🚀 Running all demos...');
      setTimeout(runAge,60); setTimeout(runVoting,140); setTimeout(runIntro,220);
      setTimeout(runAdd,300); setTimeout(runLoop,380); setTimeout(runPosNeg,460);
      setTimeout(()=> dualLog('✨ All done! 😺✨'), 540);
    }
    function clearConsole() {
      outputDiv.innerHTML = `🧹 Console cleared · ${new Date().toLocaleTimeString()}<br>✨ Ready.`;
    }

    // expose to console
    window.calculateAge = (y) => { const a=calcAge(y); console.log(`Age: ${a}`); return a; };
    window.checkVoting = (age) => age>=18;
    window.add = (a,b) => a+b;
    window.printOneToTen = ()=>{ for(let i=1;i<=10;i++) console.log(i); };
    window.posNeg = (n) => n>0?'positive':(n<0?'negative':'zero');
    console.log('%c😺 Pro Age Lab · try calculateAge(2000) or add(7,8)','color:#dbbdff;font-weight:bold');

    // listeners
    document.getElementById('calcAgeBtn').addEventListener('click', runAge);
    document.getElementById('votingBtn').addEventListener('click', runVoting);
    document.getElementById('introBtn').addEventListener('click', runIntro);
    document.getElementById('addNumbersBtn').addEventListener('click', runAdd);
    document.getElementById('loopBtn').addEventListener('click', runLoop);
    document.getElementById('posNegBtn').addEventListener('click', runPosNeg);
    document.getElementById('runAllBtn').addEventListener('click', runAll);
    document.getElementById('clearConsoleBtn').addEventListener('click', clearConsole);

    window.addEventListener('DOMContentLoaded', ()=>{
      setTimeout(()=>{
        const { name, birth } = getVars();
        const age = calcAge(birth);
        dualLog(`👋 ${name} · ${age ? `age ${age}` : 'set valid year'}. Kitty stays in corner! 😊`);
      },200);
    });
  })();
</script>
</body>
</html>
